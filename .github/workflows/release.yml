name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (empty builds the selected branch and only keeps a workflow artifact)
        required: false
        default: ''
      chiselkit_ref:
        description: ChiselKit branch, tag or commit to build against
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  macos-app:
    # the project (objectVersion 100, string catalogs 1.2) opens in Xcode 26.4 and later and needs no API newer
    # than macOS 14, but Xcode 27.2 is the toolchain this build was verified with, and only xcode-27 has it
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Check out ChiselSwift
        uses: actions/checkout@v6
        with:
          path: ChiselSwift
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # the project references ChiselKit as the local package ../ChiselKit
      - name: Check out ChiselKit next to it
        uses: actions/checkout@v6
        with:
          repository: Snesnopic/ChiselKit
          ref: ${{ inputs.chiselkit_ref || 'main' }}
          path: ChiselKit

      - name: Work out the version
        run: |
          if [[ -n "$TAG" ]]; then
            [[ "$TAG" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)$ ]] || { echo "::error::tag $TAG is not vX.Y or vX.Y.Z"; exit 1; }
            version="${BASH_REMATCH[1]}"
            zip_name="Chisel-$version.zip"
          else
            version="0.0.0"
            zip_name="Chisel-0.0.0-${GITHUB_SHA::7}.zip"
          fi
          {
            echo "VERSION=$version"
            echo "ZIP=$RUNNER_TEMP/$zip_name"
            echo "CHISELKIT_SHA=$(git -C ChiselKit rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          xcodebuild -version
          grep -m1 'objectVersion' ChiselSwift/ChiselSwift.xcodeproj/project.pbxproj

      - name: Build universal Release
        run: |
          xcodebuild -project ChiselSwift/ChiselSwift.xcodeproj -scheme ChiselSwift -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            MARKETING_VERSION="$VERSION" \
            build

      # no resource forks or extended attributes, so nothing like a quarantine flag travels inside the zip
      - name: Package
        run: |
          cd "$RUNNER_TEMP/dd/Build/Products/Release"
          ditto -c -k --norsrc --noextattr --keepParent Chisel.app "$ZIP"
          ls -l "$ZIP"

      # checks the app as it comes out of the zip, which is what gets downloaded
      - name: Verify
        run: |
          check="$RUNNER_TEMP/check"
          rm -rf "$check" && mkdir -p "$check"
          ditto -x -k "$ZIP" "$check"
          app="$check/Chisel.app"
          bin="$app/Contents/MacOS/Chisel"
          fail() { echo "::error::$1"; exit 1; }

          archs=$(lipo -archs "$bin")
          echo "archs: $archs"
          [[ $(wc -w <<< "$archs") -eq 2 && " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || fail "archs are '$archs', not arm64 x86_64"

          for arch in arm64 x86_64; do
            minos=$(vtool -arch "$arch" -show-build "$bin" | awk '$1 == "minos" { print $2 }')
            echo "minos $arch: $minos"
            [[ "$minos" == "14.0" ]] || fail "$arch minos is $minos, not 14.0"
          done

          short_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          [[ "$short_version" == "$VERSION" ]] || fail "CFBundleShortVersionString is $short_version, not $VERSION"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q '^Signature=adhoc$' "$RUNNER_TEMP/codesign.txt" || fail "not signed ad hoc"

          attrs=$(xattr -lr "$app")
          [[ -z "$attrs" ]] || fail "extended attributes found: $attrs"
          entries=$(zipinfo -1 "$ZIP")
          if grep -qE '(^|/)\._|__MACOSX' <<< "$entries"; then fail "AppleDouble entries in the zip"; fi

          echo "effective entitlements:"
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || true
          if [[ -s "$RUNNER_TEMP/entitlements.plist" ]]; then plutil -p "$RUNNER_TEMP/entitlements.plist"; else echo "(none)"; fi

      - name: Publish to the tag's release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep as a workflow artifact
        if: env.TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: chisel-macos
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: SHA-256
        run: |
          sha=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          echo "$sha  $(basename "$ZIP")"
          {
            echo "### $(basename "$ZIP")"
            echo "- SHA-256: \`$sha\`"
            echo "- Size: $(stat -f %z "$ZIP") bytes"
            echo "- ChiselKit: \`$CHISELKIT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
